<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XML Translator</title>
    <meta name="description" content="Offline Android strings.xml translation tool inspired by Weblate. Import strings.xml, translate string keys with formatted preview, and export target XML." />
    <meta property="og:title" content="XML Translator" />
    <meta property="og:description" content="Offline Android strings.xml translation tool inspired by Weblate. Import strings.xml, translate string keys with formatted preview, and export target XML." />
    <meta property="og:type" content="website" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111318" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="XML Translator" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('app_theme') || 'night';
          var isDay = t === 'day';
          var scheme = isDay ? 'only light' : 'dark';
          var root = document.documentElement;
          if (isDay) {
            root.classList.remove('dark');
            root.setAttribute('data-theme', 'day');
            root.style.colorScheme = 'only light';
          } else {
            root.classList.add('dark');
            root.setAttribute('data-theme', t === 'black_hole' ? 'black-hole' : 'night');
            root.style.colorScheme = 'dark';
          }
          var metaScheme = document.querySelector('meta[name="color-scheme"]');
          if (metaScheme) metaScheme.setAttribute('content', scheme);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', isDay ? '#f8f9fa' : (t === 'black_hole' ? '#000000' : '#111318'));
          var a = localStorage.getItem('app_accent_color') || 'teal';
          root.setAttribute('data-accent', a);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
