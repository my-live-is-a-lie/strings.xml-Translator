name: Build Web & Android APK

on:
  push:
    branches:
      - main
      - master
      - android
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Web & Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Android binary assets
        run: |
          python3 scripts/restore-android-binaries.py
          chmod +x android/gradlew

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Run linter and type check
        run: npm run lint

      - name: Build web project
        run: npm run build

      # On the android branch the native platform is committed to the repo,
      # so we sync the fresh web build into it instead of re-adding it.
      - name: Sync Capacitor Android platform
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 14

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
