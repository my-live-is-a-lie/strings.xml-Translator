name: Release signed Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 1.0.0'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSP" ] || [ -z "$KA" ]; then
            echo "::error::Missing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (see RELEASE.md)"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Build web
        run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: Add Android platform
        run: npx cap add android

      - name: Apply custom app icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "assets/icons/mipmap-$d/ic_launcher.png" "android/app/src/main/res/mipmap-$d/ic_launcher.png"
            cp "assets/icons/mipmap-$d/ic_launcher_round.png" "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
            cp "assets/icons/mipmap-$d/ic_launcher_foreground.png" "android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png"
          done
          cp assets/icons/ic_launcher_background.xml android/app/src/main/res/values/ic_launcher_background.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Harden manifest and set version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:allowBackup="false" android:usesCleartextTraffic="false"/' "$M"
          sed -i 's/android:allowBackup="true"//' "$M"
          grep -n "<application" "$M"
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          VERSION="${VERSION:-1.0.0}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" "$G"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" "$G"
          grep -n "versionCode\|versionName" "$G"

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Align and sign APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          export KP_OR_KSP="${KP:-$KSP}"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KA" --ks-pass env:KSP --key-pass env:KP_OR_KSP \
            --out "xml-translator-${VERSION}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "xml-translator-${VERSION}.apk"
          sha256sum "xml-translator-${VERSION}.apk" | tee "xml-translator-${VERSION}.apk.sha256"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: |
            xml-translator-*.apk
            xml-translator-*.apk.sha256

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xml-translator-*.apk
            xml-translator-*.apk.sha256
